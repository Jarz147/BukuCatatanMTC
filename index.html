<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial Machine Repair Log</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1><span class="neon-text">REPAIR</span> LOG SYSTEM</h1>
            <p class="subtitle">Industrial Automation Maintenance Database</p>
        </header>

        <section class="search-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Cari keyword masalah (contoh: 'Overheat', 'E-Stop')...">
                <button id="searchBtn">CARI</button>
            </div>
        </section>

        <section class="form-section">
            <div class="glass-card">
                <h3>Tambah Catatan Perbaikan Baru</h3>
                <form id="repairForm">
                    <div class="input-group">
                        <label>Nama Mesin / Line</label>
                        <input type="text" id="machineName" required placeholder="Contoh: Robot Line 1">
                    </div>
                    <div class="input-group">
                        <label>Masalah / Error Code</label>
                        <input type="text" id="errorCode" required placeholder="Contoh: E-004 Motor Jam">
                    </div>
                    <div class="input-group">
                        <label>Langkah-langkah Perbaikan</label>
                        <textarea id="repairSteps" rows="4" required placeholder="Tuliskan solusi langkah demi langkah..."></textarea>
                    </div>
                    <button type="submit" class="submit-btn">SIMPAN DATA</button>
                </form>
            </div>
        </section>

        <section class="results-section">
            <h3>Hasil Pencarian / Database</h3>
            <div id="resultsContainer" class="results-grid">
                <!-- Data dari Supabase akan muncul di sini -->
            </div>
        </section>
    </div>

    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
