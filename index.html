<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Log System v2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <h1>🛠️ LOG PERBAIKAN MESIN</h1>
        <p>Klik pada baris histori untuk melihat detail perbaikan</p>
    </header>

    <section class="form-section">
        <h3>Pencatatan Trouble Baru</h3>
        <form id="repairForm">
            <div class="main-grid">
                <div class="input-group">
                    <label>Nama Mesin / Line</label>
                    <input type="text" id="machineName" placeholder="Contoh: Robot Line A" required>
                </div>
                <div class="input-group">
                    <label>Tanggal Perbaikan</label>
                    <input type="date" id="repairDate" required>
                </div>
                <div class="input-group full-width">
                    <label>Gejala / Masalah (Trouble)</label>
                    <input type="text" id="trouble" placeholder="Deskripsi singkat kerusakan" required>
                </div>
                
                <div class="input-group full-width">
                    <label>Spare Part yang Diganti (Pisahkan dengan koma)</label>
                    <input type="text" id="partsChanged" placeholder="Contoh: Sensor Proximity, Kabel AWG24, Fuse 5A">
                </div>

                <div class="steps-container full-width">
                    <label>Langkah-langkah Perbaikan:</label>
                    <div id="stepsList">
                        <div class="step-item">
                            <span class="step-number">1</span>
                            <input type="text" class="step-input" placeholder="Langkah pertama..." required>
                        </div>
                    </div>
                    <button type="button" id="addStepBtn" class="btn-add-step">+ Tambah Langkah</button>
                </div>

                <button type="submit" class="btn-submit">SIMPAN DATA</button>
            </div>
        </form>
    </section>

    <section class="search-section">
        <input type="text" id="searchInput" placeholder="🔍 Cari histori..." onkeyup="searchLogs()">
    </section>

    <section class="table-section">
        <table>
            <thead>
                <tr>
                    <th>Tanggal</th>
                    <th>Mesin</th>
                    <th>Masalah</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="logTableBody"></tbody>
        </table>
    </section>
</div>

<div id="detailModal" class="modal">
    <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2 id="modalTitle" style="color: var(--primary-neon);">Detail Perbaikan</h2>
        <hr border="1" color="#30363d">
        
        <div class="detail-group">
            <h4>🛠️ Masalah:</h4>
            <p id="modalTrouble"></p>
        </div>

        <div class="detail-group">
            <h4>📦 Spare Part yang Diganti:</h4>
            <p id="modalParts" class="highlight-yellow"></p>
        </div>

        <div class="detail-group">
            <h4>📋 Langkah-langkah Perbaikan:</h4>
            <ol id="modalSteps" class="modal-step-list"></ol>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
