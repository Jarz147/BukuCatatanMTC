<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTC Error Database</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-wrapper">
                <img src="image-removebg-preview (5).png" alt="Logo" class="main-logo">
            </div>
            <p class="subtitle">Database Maintenance SDI</p>
        </header>

        <section class="search-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Cari mesin atau kode error...">
                <button id="searchBtn">CARI</button>
            </div>
        </section>

        <section class="form-section">
            <div class="glass-card">
                <h3>Input Data Perbaikan</h3>
                <form id="repairForm">
                    <div class="input-group">
                        <label>Nama Mesin</label>
                        <input type="text" id="machineName" required>
                    </div>
                    <div class="input-group">
                        <label>Error Code</label>
                        <input type="text" id="errorCode" required>
                    </div>
                    <div class="input-group">
                        <label>Langkah Perbaikan</label>
                        <textarea id="repairSteps" rows="4" required></textarea>
                    </div>
                    <div class="input-group">
                        <label>Lampiran (Foto/PDF - Auto Compress)</label>
                        <input type="file" id="fileInput" accept="image/*,application/pdf">
                        <small id="statusCompress" style="color: var(--accent-color); display:block; margin-top:5px;"></small>
                    </div>
                    <button type="submit" class="submit-btn" id="submitBtn">SIMPAN KE DATABASE</button>
                </form>
            </div>
        </section>

        <section class="results-section">
            <div id="resultsContainer" class="results-grid"></div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
